# Team defaults layered onto every tartarus sandbox, whatever the harness.
# Validate with: sbx kit validate ./kits/team-baseline
#
# The global policy is deny-all (tartarus setup), so the harness kit's own vendor
# endpoints are the sandbox's entire reachable internet. This kit allows nothing more:
# every domain is a possible exfiltration path. npm and PyPI are opt-in (kits/registries).
schemaVersion: "2"
kind: mixin
name: team-baseline
description: Team defaults for running AI coding agents in sbx

setup:
  startup:
    # The image runs a Wayland clipboard bridge to the host. tartarus setup turns host
    # clipboard sharing off; this also removes the in-VM end so nothing can talk to it.
    - command: ["sh", "-c", "pkill -f '^/usr/local/bin/clipboard-bridge'; rm -f /run/user/1000/wayland-0; true"]
      user: "0"
      description: Remove the host clipboard bridge
