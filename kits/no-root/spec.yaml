# Takes root away from the agent inside the sandbox: no sudo, no Docker socket.
# The microVM is the real boundary; this keeps guest root, the usual first step of any
# attack on that boundary, out of the agent's hands. Package installs are already blocked
# by the deny-all policy, so sudo buys the agent little. Opt out with TARTARUS_ALLOW_ROOT=1.
# The host can still get root in a sandbox with: sbx exec -u root <name> ... Use absolute
# paths, and don't run tools in the workspace as root: that runs the agent's code as root.
schemaVersion: "2"
kind: mixin
name: no-root
description: "Keep root from the agent: no sudo, no Docker, no writable root PATH or BASH_ENV"

setup:
  startup:
    - command:
        - /bin/sh
        - -c
        # sbx exec adds the sudo and docker groups to every session whatever /etc/group says,
        # so close the grants themselves: the sudoers entry and the Docker socket's group access.
        # The agent's password is locked (!), so group sudo alone can't authenticate.
        #
        # Root's PATH in the VM (startup commands, dockerd, sbx exec -u root) starts with
        # ~/.local/bin and the npm-global bin, which the agent owns: a planted ~/.local/bin/mkdir
        # ran as root on the next start (tested). Read-only bind mounts close both. A mount point
        # can't be renamed or removed, but its parent can (taking the mount along), so ~/.local is
        # bound onto itself too, read-write: then neither can be swapped for a fresh one. Every bash
        # sources $BASH_ENV, /etc/sandbox-persistent.sh, which the agent could write: root's too.
        # This runs before the agent's first session, so both are still clean here. Side effect:
        # pip install --user and npm -g can't add commands (use a venv or npx).
        - >-
          PATH=/usr/sbin:/usr/bin:/sbin:/bin; export PATH;
          rm -f /etc/sudoers.d/agent;
          chown root:root /etc/sandbox-persistent.sh; chmod 644 /etc/sandbox-persistent.sh;
          for i in $(seq 30); do [ -S /var/run/docker.sock ] && break; sleep 1; done;
          chmod 600 /var/run/docker.sock;
          mountpoint -q /home/agent/.local || mount --bind /home/agent/.local /home/agent/.local || exit 1;
          for d in /home/agent/.local/bin /usr/local/share/npm-global/bin; do
            [ -L "$d" ] && rm -f "$d"; mkdir -p "$d";
            mountpoint -q "$d" || { mount --bind "$d" "$d" && mount -o remount,bind,ro "$d"; } || exit 1;
          done
      user: "0"
      description: Drop the agent's sudo grant, Docker socket access and writable root PATH entries
