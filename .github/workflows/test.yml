# Stub-sbx tests and shellcheck (preinstalled on the runner, as is yq). Live checks need a
# real sbx: run tartarus verify on a sandbox after changing a kit or policy.
name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash test/tartarus_test.sh
